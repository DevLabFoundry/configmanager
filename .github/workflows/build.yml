name: CI

on:
  pull_request:
    branches: [master, main, v3]
  push:
    branches: 
      - master
      - main
      - v3

permissions:
  contents: write
  statuses: write
  checks: write
  pull-requests: write

jobs:
  set-version:
    name: Set Version
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: install deps
        run: |
          apt-get update && apt-get install -y jq git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email ${{ github.actor }}-ci@gha.org
          git config user.name ${{ github.actor }}
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: "6.x"
      - name: Set SemVer Version
        uses: gittools/actions/gitversion/execute@v4.7.0
        id: gitversion
        with:
          overrideConfig: |
            next-version=3.0.0

      - name: echo VERSIONS
        run: |
          echo "REVISION  -> $GITHUB_SHA"
          echo "VERSION -> $GITVERSION_SEMVER"

  test:
    runs-on: ubuntu-latest
    name: Run Tests
    needs: set-version
    env:
      SEMVER: ${{ needs.set-version.outputs.semVer }}
      GIT_TAG: ${{ needs.set-version.outputs.semVer }}
      GOVCS: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install Eirctl
        uses: ensono/actions/eirctl-setup@55f3b0ea2cf99acef7eabc873fcf088834ef4582
        with:
          version: v0.11.29
          sha256: sha256:c32bbb8984b78e460fbe6daebb36d872d7fbc708d45165557b246a5e88c041f9

      - name: Run Lint
        run: |
          eirctl run pipeline lint
      - name: Run Tests
        run: |
          eirctl run pipeline gha:unit:test

      - name: Publish Junit style Test Report
        uses: mikepenz/action-junit-report@v4
        if: always() # always run even if the previous step fails
        with:
          report_paths: "**/.coverage/report-junit.xml"

      - name: Run SonarCloud Scan
        env:
          # Needed to get PR information
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Generate a token on Sonarcloud.io, add it to the secrets of this repo with the name SONAR_TOKEN (Settings > Secrets > Actions > add new repository secret)
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mkdir -p ${PWD}/.scannerwork
          chmod 0777 -R ${PWD}/.scannerwork
          cp "$GITHUB_EVENT_PATH" .github/sonar-event.json
          set +e
          GITHUB_EVENT_PATH=/eirctl/.github/sonar-event.json \
          eirctl run pipeline sonar-scan -- -Dsonar.projectVersion=${{ needs.set-version.outputs.semVer }} \
            -Dsonar.working.directory=/eirctl/.scannerwork \
            -Dsonar.scm.provider=git || echo "deleting .scannerwork"
          scan_status=$?
          set -e
          echo "Scan status: $scan_status"
